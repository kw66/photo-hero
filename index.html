<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>照片勇者</title>
    <link rel="stylesheet" href="./styles.css?v=20260519-slot-estimate">
  </head>
  <body>
    <main class="app-shell">
      <section class="game-panel" aria-label="照片勇者游戏面板">
        <div class="game-board">
          <section class="hero-zone" aria-label="勇者属性和装备">
            <div class="zone-head hero-head">
              <h2>照片勇者</h2>
              <div class="panel-tools" aria-label="面板工具">
                <button class="tool-button api-config-button" id="configToggleBtn" type="button" data-panel-target="config" data-state="missing" aria-pressed="false">API配置 <span class="api-state-icon" aria-hidden="true"></span></button>
                <button class="ghost-button" id="resetGameBtn" type="button">重开</button>
              </div>
            </div>

            <div class="hero-summary">
              <button class="hero-form-card" type="button" data-panel-target="forms" aria-pressed="false" aria-label="切换角色形态">
                <img id="heroAvatarImage" src="./assets/heroes/form-hp.png" alt="照片勇者形态">
                <span data-form-label>生命形态</span>
              </button>

              <div class="hero-stat-card">
                <dl class="hero-stat-strip hero-stats">
                  <div><dt>攻击</dt><dd id="playerAtk">5</dd></div>
                  <div><dt>吸血</dt><dd id="playerLifesteal">0</dd></div>
                  <div><dt>速度</dt><dd id="playerSpeed">3</dd></div>
                  <div><dt>防御</dt><dd id="playerDef">1</dd></div>
                  <div><dt>回复</dt><dd id="playerRegen">0</dd></div>
                  <div><dt>护盾</dt><dd id="playerShield">0 / 0</dd></div>
                </dl>
                <div class="vital-row hp-row hero-hp">
                  <span>生命</span>
                  <strong id="playerHpText">30 / 30</strong>
                  <div class="hp-track"><span id="playerHpBar"></span></div>
                </div>
              </div>
            </div>

            <section class="loot-panel" aria-label="鉴定结果和背包">
              <input id="fileInput" type="file" accept="image/*">
              <div class="equipment-layout">
                <div class="equipment-focus">
                  <button class="detail-image-frame" id="cameraFrame" type="button" aria-label="拍照或上传图片">
                    <img id="photoPreview" alt="待鉴定图片预览">
                    <img id="equipmentDetailImage" alt="装备图片预览">
                    <span id="equipmentDetailEmpty"></span>
                    <span class="film-badge" id="filmCountBadge">胶卷 1.0</span>
                  </button>
                  <article class="equipment-detail" id="equipmentDetail" aria-label="装备详情" tabindex="0">
                    <div class="detail-head">
                      <strong id="equipmentDetailName">未选择装备</strong>
                      <div class="detail-actions" id="equipmentActions" hidden>
                        <button class="ghost-button detail-action icon-action danger-button" id="discardItemBtn" type="button" aria-label="丢弃装备">
                          <svg aria-hidden="true" viewBox="0 0 24 24">
                            <path d="M3 6h18"></path>
                            <path d="M8 6V4h8v2"></path>
                            <path d="M6 6l1 15h10l1-15"></path>
                            <path d="M10 10v7"></path>
                            <path d="M14 10v7"></path>
                          </svg>
                        </button>
                      </div>
                    </div>
                    <div class="detail-stats" id="equipmentDetailStats"></div>
                    <p id="equipmentDetailDesc">装备会显示缩略图，点击格子后在这里查看图片和描述。</p>
                    <span id="loadingState"></span>
                  </article>
                </div>
                <div class="equipment-grid" id="equipmentGrid" aria-label="装备格子"></div>
              </div>
            </section>

            <section class="secondary-area is-collapsed" id="secondaryArea" aria-label="次要面板">
              <section class="forms-panel secondary-content" data-secondary-panel="forms" aria-label="角色形态" hidden>
                <div class="secondary-head">
                  <div>
                    <h2>角色形态</h2>
                  </div>
                  <button class="ghost-button" type="button" data-panel-target="none">收起</button>
                </div>
                <div class="form-grid" id="formGrid"></div>
              </section>

              <section class="config-panel secondary-content" data-secondary-panel="config" aria-label="API 配置">
                <div class="secondary-head">
                  <div>
                    <h2>API 设置</h2>
                  </div>
                  <button class="ghost-button" type="button" data-panel-target="none">收起</button>
                </div>

                <div class="preset-row" aria-label="模型预设">
                  <button class="preset-button" type="button" data-preset="siliconflow">硅基流动</button>
                  <button class="preset-button" type="button" data-preset="zhipu">智谱</button>
                  <button class="preset-button" type="button" data-preset="micu">米醋中转</button>
                  <button class="preset-button" type="button" data-preset="custom">自定义</button>
                </div>
                <p class="preset-note" id="presetNote" hidden></p>
                <div class="provider-links" id="providerLinks" aria-label="官方 API 链接"></div>

                <div class="config-grid">
                  <label>
                    <span>API Base URL</span>
                    <input id="baseUrlInput" type="url" autocomplete="off" placeholder="选择预设或手动填写">
                  </label>
                  <label id="presetModelField">
                    <span>Model</span>
                    <select id="modelInput"></select>
                  </label>
                  <label class="custom-model-field" id="customModelField" hidden>
                    <span>Model</span>
                    <input id="customModelInput" type="text" autocomplete="off" placeholder="例如 Qwen/Qwen3.6-35B-A3B">
                  </label>
                  <label class="wide-field">
                    <span>API Key</span>
                    <div class="secret-field">
                      <input id="apiKeyInput" type="password" autocomplete="off" placeholder="sk-...">
                      <button class="secret-toggle" id="toggleKeyBtn" type="button" aria-label="显示 API Key">
                        <svg class="eye-icon" aria-hidden="true" viewBox="0 0 24 24">
                          <path class="eye-outline" d="M2.2 12s3.5-6 9.8-6 9.8 6 9.8 6-3.5 6-9.8 6-9.8-6-9.8-6Z"></path>
                          <circle class="eye-pupil" cx="12" cy="12" r="2.7"></circle>
                          <path class="eye-slash" d="M4.5 20 19.5 4"></path>
                        </svg>
                        <span class="visually-hidden">显示 API Key</span>
                      </button>
                    </div>
                  </label>
                </div>

                <p class="privacy-note">照片鉴定需要模型支持图片输入和浏览器 CORS。图片会自动压缩，模型参数使用游戏内置默认值。</p>
                <div class="config-actions">
                  <button class="secondary-button" id="saveConfigBtn" type="button">保存配置</button>
                  <button class="primary-button" id="testChatBtn" type="button">测试图文模型</button>
                </div>
                <div class="chat-test">
                  <div class="chat-result" id="chatResult">还没有测试结果。</div>
                </div>
              </section>

            </section>
          </section>

          <section class="enemy-zone" aria-label="敌人和战报">
            <div class="floor-action-row" aria-label="楼层和战斗操作">
              <strong id="floorText">第 1 / 40 层</strong>
              <button class="primary-button" id="attackBtn" type="button">战斗</button>
              <button class="secondary-button" id="fleeBtn" type="button">逃跑</button>
            </div>

            <div class="enemy-field" id="enemyField" aria-label="敌人列表"></div>

            <section class="battle-report" aria-label="战斗播报">
              <ol id="battleLog"></ol>
            </section>
          </section>
        </div>
      </section>
    </main>

    <button class="image-viewer" id="imageViewer" type="button" hidden aria-label="关闭装备大图">
      <img id="imageViewerImage" alt="装备大图">
      <span id="imageViewerCaption"></span>
    </button>

    <script defer src="./app.js?v=20260519-slot-estimate"></script>
  </body>
</html>
